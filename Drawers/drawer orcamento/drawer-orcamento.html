<!-- Overlay para escurecer o fundo -->
<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="drawer" id="orcamentoDrawer">
  <div class="drawer-body">
    <div class="drawer-header">
      <h2>Criar Orçamento</h2>
      <p>Defina um limite para controlar seus gastos.</p>
    </div>

    <form id="orcamentoForm" novalidate>
      
      <div class="form-group">
        <div class="label-wrapper">
          <label for="nomeOrcamento">Nome do Orçamento</label>
          <span class="error-msg" id="error-nomeOrcamento">* Campo obrigatório</span>
        </div>
        <input type="text" id="nomeOrcamento" class="form-control" placeholder="Ex: Orçamento Mensal">
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="categoriaOrcamento">Categoria</label>
          <span class="error-msg" id="error-categoriaOrcamento">* Campo obrigatório</span>
        </div>
        <select id="categoriaOrcamento" class="form-control">
          <option value="" disabled selected>Selecione uma categoria</option>
          <option value="Alimentação">Alimentação</option>
          <option value="Moradia">Moradia</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
        </select>
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="limiteGastos">Limite de Gastos</label>
          <span class="error-msg" id="error-limiteGastos">* Campo obrigatório</span>
        </div>
        <input type="text" id="limiteGastos" class="form-control" placeholder="R$ 0,00">
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="mesReferencia">Mês de Referência</label>
          <span class="error-msg" id="error-mesReferencia">* Campo obrigatório</span>
        </div>
        <select id="mesReferencia" class="form-control">
          <option value="" disabled selected>Selecione o mês</option>
          <option value="Janeiro">Janeiro</option>
          <option value="Fevereiro">Fevereiro</option>
          <option value="Março">Março</option>
          <option value="Abril">Abril</option>
          <option value="Maio">Maio</option>
          <option value="Junho">Junho</option>
          <option value="Julho">Julho</option>
          <option value="Agosto">Agosto</option>
          <option value="Setembro">Setembro</option>
          <option value="Outubro">Outubro</option>
          <option value="Novembro">Novembro</option>
          <option value="Dezembro">Dezembro</option>
        </select>
      </div>

    </form>
  </div>

  <div class="drawer-footer">
    <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
    <button type="button" class="btn-submit" id="btnSave">Criar Orçamento</button>
  </div>
</aside>
