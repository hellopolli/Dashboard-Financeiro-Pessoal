
<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="drawer" id="accountDrawer">
  <div class="drawer-body">
    <div class="drawer-header">
      <h2>Criar Conta</h2>
      <p>Cadastre uma conta para acompanhar seu saldo.</p>
    </div>

    <form id="accountForm" novalidate>
      
      <div class="form-group">
        <div class="label-wrapper">
          <label for="nomeConta">Nome da Conta</label>
          <span class="error-msg" id="error-nomeConta">* Campo obrigatório</span>
        </div>
        <input type="text" id="nomeConta" class="form-control" placeholder="Ex: Conta Principal">
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="instituicao">Instituição Financeira</label>
          <span class="error-msg" id="error-instituicao">* Campo obrigatório</span>
        </div>
        <input type="text" id="instituicao" class="form-control" placeholder="Ex: Banco">
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="tipoConta">Tipo de Conta</label>
          <span class="error-msg" id="error-tipoConta">* Campo obrigatório</span>
        </div>
        <select id="tipoConta" class="form-control">
          <option value="" disabled selected>Selecione o tipo de conta</option>
          <option value="Conta Corrente">Conta Corrente</option>
          <option value="Conta Poupança">Conta Poupança</option>
          <option value="Conta Salário">Conta Salário</option>
          <option value="Conta Universitária">Conta Universitária</option>
          <option value="Conta Conjunta">Conta Conjunta</option>
        </select>
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="saldoInicial">Saldo Inicial</label>
          <span class="error-msg" id="error-saldoInicial">* Campo obrigatório</span>
        </div>
        <input type="text" id="saldoInicial" class="form-control" placeholder="R$ 0,00">
      </div>

    </form>
  </div>

  <div class="drawer-footer">
    <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
    <button type="button" class="btn-submit" id="btnSave">Salvar Conta</button>
  </div>
</aside>
