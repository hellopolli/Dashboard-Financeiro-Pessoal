<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | Ctrl + Alt + $</title><link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <aside class="brand-panel" aria-label="Ctrl + Alt + $">
      <div class="brand"><span class="brand-mark" aria-hidden="true">$</span><span>Ctrl + Alt + $</span></div>
      <section class="brand-copy"><p class="eyebrow">SEU CONTROLE FINANCEIRO</p><h1>Seu dinheiro, seus planos, seu futuro.</h1><p>Estamos aqui para ajudar você a recuperar o acesso à sua conta.</p></section>
      <div class="mini-categories" aria-hidden="true"><span>Receitas</span><span>Despesas</span></div>
    </aside>
    <section class="form-panel">
      <form class="form-card" id="forgot-form" novalidate>
        <h2>Esqueceu sua senha?</h2><p class="subtitle">Informe seu e-mail para receber as instruções de recuperação.</p>
        <div class="notice" id="forgot-notice" role="status" aria-live="polite"></div>
        <div class="field"><label for="email">E-mail Cadastrado</label><input id="email" name="email" type="email" autocomplete="email" placeholder="seu-email@email.com" required></div>
        <div class="form-spacer"></div>
        <button class="primary-button" type="submit">Enviar Instruções</button>
        <p class="form-footer"><a href="/login.html">← Voltar ao Login</a></p>
      </form>
    </section>
  </main>
  <script src="/auth.js" defer></script>
</body>
</html>
