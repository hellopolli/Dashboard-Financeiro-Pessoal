<!-- Overlay para escurecer o fundo -->
<div class="drawer-overlay" id="drawerOverlay"></div>

<!-- CONTAINER DO DRAWER -->
<aside class="drawer" id="transactionDrawer">
  <div class="drawer-body">
    <div class="drawer-header">
      <h2>Adicionar Transação</h2>
      <p>Registre uma receita ou despesa.</p>
    </div>

    <form id="transactionForm" novalidate>
      
      <div class="form-group">
        <div class="label-wrapper">
          <label>Tipo de Transação</label>
          <span class="error-msg" id="error-tipo">* Campo obrigatório</span>
        </div>
        <div class="type-selector">
          <button type="button" class="btn-type receita" data-type="Receita">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M17 7H7M17 7V17" />
            </svg>
            Receita
          </button>
          <button type="button" class="btn-type despesa active" data-type="Despesa">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 7L7 17M7 17H17M7 17V7" />
            </svg>
            Despesa
          </button>
        </div>
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="descricao">Descrição</label>
          <span class="error-msg" id="error-descricao">* Campo obrigatório</span>
        </div>
        <input type="text" id="descricao" class="form-control" placeholder="Ex: Compra de Mercado">
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="valor">Valor</label>
          <span class="error-msg" id="error-valor">* Campo obrigatório</span>
        </div>
        <input type="text" id="valor" class="form-control" placeholder="R$ 0,00">
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="categoria">Categoria</label>
          <span class="error-msg" id="error-categoria">* Campo obrigatório</span>
        </div>
        <select id="categoria" class="form-control">
          <option value="" disabled selected>Selecione uma categoria</option>
          <option value="Moradia">Moradia</option>
          <option value="Alimentação">Alimentação</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
        </select>
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="conta">Conta</label>
          <span class="error-msg" id="error-conta">* Campo obrigatório</span>
        </div>
        <select id="conta" class="form-control">
          <option value="" disabled selected>Selecione uma conta</option>
        </select>
      </div>

      <div class="form-group">
        <div class="label-wrapper">
          <label for="data">Data</label>
          <span class="error-msg" id="error-data">* Campo obrigatório</span>
        </div>
        <input type="date" id="data" class="form-control">
      </div>

    </form>
  </div>

  <div class="drawer-footer">
    <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
    <button type="button" class="btn-submit" id="btnSave">Salvar Transação</button>
  </div>
</aside>
